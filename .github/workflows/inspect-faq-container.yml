name: Inspect public FAQ tag
on:
  push:
    branches: [faq-question-breakdown]
    paths: [.github/workflows/inspect-faq-container.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public container
        run: |
          node - <<'NODE'
          const source = await (await fetch('https://cdn.matomo.cloud/dp.matomo.cloud/container_8uWjRDfN.js')).text();
          const position = source.indexOf("track('FAQ open'");
          console.log(position < 0 ? 'FAQ tag not found' : source.slice(position - 300, position + 100));
          NODE
      - name: Inspect aggregate FAQ event names
        env:
          MATOMO_CLIENT_ID: ${{ vars.MATOMO_CLIENT_ID }}
          MATOMO_CLIENT_SECRET: ${{ secrets.MATOMO_CLIENT_SECRET }}
        run: |
          node - <<'NODE'
          const origin='https://dp.matomo.cloud/index.php';
          const oauth=await fetch(origin+'?module=OAuth2&action=token',{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'client_credentials',client_id:process.env.MATOMO_CLIENT_ID,client_secret:process.env.MATOMO_CLIENT_SECRET,scope:'matomo:read'})});
          if(!oauth.ok)throw Error('OAuth failed: '+oauth.status);
          const token=(await oauth.json()).access_token;
          async function report(method,date,extra={}){
            const body=new URLSearchParams({module:'API',method,idSite:'3',period:'day',date,format:'JSON',segment:'',filter_limit:'-1',...extra});
            const response=await fetch(origin,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded',authorization:'Bearer '+token},body});
            if(!response.ok)throw Error(method+' HTTP '+response.status);
            return response.json();
          }
          for(const date of ['2026-09-28','2026-09-29']){
            const categories=await report('Events.getCategory',date);
            const category=categories.find(row=>row.label==='GF27');
            console.log(date+' category:',category&&{label:category.label,nb_events:category.nb_events,idsubdatatable:category.idsubdatatable});
            if(category?.idsubdatatable){
              const names=await report('Events.getNameFromCategoryId',date,{idSubtable:String(category.idsubdatatable)});
              console.log(date+' names from category:',names.map(row=>({label:row.label,nb_events:row.nb_events,idsubdatatable:row.idsubdatatable})));
              const actions=await report('Events.getActionFromCategoryId',date,{idSubtable:String(category.idsubdatatable)});
              console.log(date+' actions:',actions.map(row=>({label:row.label,nb_events:row.nb_events,idsubdatatable:row.idsubdatatable})));
            }
            const names=await report('Events.getName',date,{segment:'eventCategory==GF27;eventAction==FAQ open'});
            console.log(date+' names via segment:',names.map(row=>({label:row.label,nb_events:row.nb_events})));
          }
          NODE
